<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DIZELTRADE">
<title>DIZELTRADE · Лёгкая версия</title>
<script>
  // Remember UI version choice: if user switched back to full, go there.
  try { if (localStorage.getItem('dtl_ui') === 'full') location.replace('/'); } catch (e) {}
</script>
<style>
/* ════════════════════════════════════════════════════════════════════════
   DIZELTRADE · ЛЁГКАЯ ВЕРСИЯ
   Простой, чистый интерфейс. Те же цвета, что и в полной версии.
   Принцип: один экран = заголовок + большая кнопка «Добавить» + понятный
   список. Формы — в простом всплывающем окне снизу.
════════════════════════════════════════════════════════════════════════ */

/* ── Reset ─────────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── Цветовые токены (как в полной версии) ─────────────────────────────── */
:root{
  --bg:#111;--card:#1c1c1e;--card2:#242426;--card3:#2c2c2e;
  --accent:#c8ff00;--accent-dim:rgba(200,255,0,.12);--accent-mid:rgba(200,255,0,.2);
  --text:#fff;--text2:#8e8e93;--text3:#48484a;
  --border:#2c2c2e;--border2:#3a3a3c;
  --red:#ff453a;--green:#32d74b;--orange:#ff9f0a;--blue:#0a84ff;--purple:#bf5af2;
  --radius:16px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;background:#0a0a0a;color:var(--text);font-size:16px}
body{display:flex;flex-direction:column;min-height:100vh}
input,select,textarea,button{font-family:inherit}

/* ── App root ──────────────────────────────────────────────────────────── */
#root{flex:1;display:flex;flex-direction:column;min-height:100vh}

/* ════════════════════════════════════════════════════════════════════════
   ЭКРАН ВХОДА
════════════════════════════════════════════════════════════════════════ */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:#0a0a0a}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:36px 26px;border:1px solid var(--border2);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.login-logo{font-size:34px;font-weight:900;letter-spacing:-1px;text-align:center;margin-bottom:6px}
.login-logo span{color:var(--accent)}
.login-sub{text-align:center;font-size:14px;color:var(--text2);margin-bottom:30px}
.login-err{background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.25);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--red);margin-bottom:16px}

/* ════════════════════════════════════════════════════════════════════════
   КАРКАС ПРИЛОЖЕНИЯ
════════════════════════════════════════════════════════════════════════ */
.shell{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}

/* ── Верхняя панель ────────────────────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:#111113;position:sticky;top:0;z-index:40}
.topbar .logo{font-size:19px;font-weight:900;letter-spacing:-.5px}
.topbar .logo span{color:var(--accent)}
.topbar .spacer{flex:1}
.topbar .who{font-size:13px;color:var(--text2);text-align:right;line-height:1.3}
.topbar .who b{color:var(--text);display:block;font-size:14px}
.btn-ghost{background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:8px 12px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{border-color:var(--accent)}
.btn-ghost.danger:hover{border-color:var(--red);color:var(--red)}

/* ── Контент ───────────────────────────────────────────────────────────── */
.main{flex:1;display:flex;min-height:0}
.content{flex:1;padding:20px 16px 96px;overflow-y:auto;max-width:920px;margin:0 auto;width:100%}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Заголовок страницы ────────────────────────────────────────────────── */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-head .pt{flex:1;min-width:0}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.page-head .psub{font-size:14px;color:var(--text2);margin-top:2px}

/* ── Нижняя навигация (мобильная) / боковая (десктоп) ──────────────────── */
.nav{display:flex;background:rgba(28,28,30,.98);border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:50;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 2px;color:var(--text2);min-width:0}
.nav-item .ni{font-size:22px;line-height:1}
.nav-item .nl{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-item.active{color:var(--accent)}

/* ════════════════════════════════════════════════════════════════════════
   КОМПОНЕНТЫ
════════════════════════════════════════════════════════════════════════ */

/* ── Большая кнопка ────────────────────────────────────────────────────── */
.btn{display:block;width:100%;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:800;cursor:pointer;transition:transform .12s,opacity .12s;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{opacity:.92}
.btn-sec{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
.btn-sec:hover{background:var(--card3)}
.btn-add{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#000;border:none;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn-add:active{transform:scale(.97)}
.btn-danger{background:rgba(255,69,58,.14);color:var(--red);border:1px solid rgba(255,69,58,.3)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* ── Большие цифры (главные показатели) ────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat .sl{font-size:13px;color:var(--text2);margin-bottom:8px}
.stat .sv{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1}
.stat .sv small{font-size:15px;color:var(--text2);font-weight:600}
.stat .sx{font-size:12px;color:var(--text2);margin-top:6px}
.stat.accent .sv{color:var(--accent)}
.stat.red .sv{color:var(--red)}
.stat.green .sv{color:var(--green)}
.stat.orange .sv{color:var(--orange)}

/* ── Раздел ────────────────────────────────────────────────────────────── */
.section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin:24px 0 12px}

/* ── Список / строки ───────────────────────────────────────────────────── */
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:border-color .12s}
.row.tap{cursor:pointer}
.row.tap:hover{border-color:var(--border2)}
.row .ricon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--card2)}
.row .ricon.green{background:rgba(50,215,75,.15)}
.row .ricon.orange{background:rgba(255,159,10,.15)}
.row .ricon.blue{background:rgba(10,132,255,.15)}
.row .ricon.red{background:rgba(255,69,58,.15)}
.row .ricon.accent{background:var(--accent-dim)}
.row .rmain{flex:1;min-width:0}
.row .rtitle{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rsub{font-size:13px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rright{text-align:right;flex-shrink:0}
.row .rval{font-size:16px;font-weight:800}
.row .rval.accent{color:var(--accent)}
.row .rval.red{color:var(--red)}
.row .rval.green{color:var(--green)}
.row .rvsub{font-size:12px;color:var(--text2);margin-top:2px}

/* ── Бейдж статуса ─────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px}
.badge.green{background:rgba(50,215,75,.14);color:var(--green)}
.badge.orange{background:rgba(255,159,10,.16);color:var(--orange)}
.badge.blue{background:rgba(10,132,255,.16);color:var(--blue)}
.badge.red{background:rgba(255,69,58,.14);color:var(--red)}
.badge.accent{background:var(--accent-dim);color:var(--accent)}
.badge.gray{background:var(--card2);color:var(--text2)}

/* ── Инфо-плашка ───────────────────────────────────────────────────────── */
.note{border-radius:12px;padding:13px 16px;font-size:14px;margin-bottom:16px;line-height:1.45}
.note.info{background:var(--accent-dim);border:1px solid rgba(200,255,0,.18);color:var(--accent)}
.note.warn{background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25);color:var(--orange)}
.note.blue{background:rgba(10,132,255,.12);border:1px solid rgba(10,132,255,.25);color:#7ab8ff}

/* ── Пустое состояние ──────────────────────────────────────────────────── */
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.empty .ei{font-size:44px;margin-bottom:12px;opacity:.6}
.empty .et{font-size:15px}

/* ── Спиннер ───────────────────────────────────────────────────────────── */
.spin-wrap{display:flex;justify-content:center;padding:60px}
.spin{width:34px;height:34px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Под-вкладки ───────────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:18px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.active{background:var(--accent);color:#000;font-weight:700}

/* ════════════════════════════════════════════════════════════════════════
   ФОРМЫ (всплывающее окно снизу)
════════════════════════════════════════════════════════════════════════ */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px}
.field label .req{color:var(--accent)}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:14px 15px;font-size:16px;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--text3)}
.field textarea{min-height:72px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field .hint{font-size:12px;color:var(--text2);margin-top:6px}
.field .calc{background:var(--accent-dim);border:1px solid rgba(200,255,0,.2);border-radius:10px;padding:10px 13px;font-size:14px;color:var(--accent);margin-top:8px;font-weight:600}

/* ── Чипсы (выбор одного из вариантов) ─────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:10px 15px;font-size:15px;color:var(--text2);cursor:pointer;user-select:none;transition:all .12s}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.chip:not(.sel):hover{border-color:var(--text2);color:var(--text)}

/* ── Оверлей формы ─────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:200;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#1c1c1e;border:1px solid var(--border2);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:translateY(0)}}
.sheet-head{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.sheet-head h2{font-size:19px;font-weight:800;flex:1}
.sheet-head .x{font-size:26px;color:var(--text2);cursor:pointer;line-height:1;padding:0 4px}
.sheet-body{padding:20px;overflow-y:auto;flex:1}
.sheet-foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}

/* ── Подтверждение ─────────────────────────────────────────────────────── */
.confirm{background:#1c1c1e;border:1px solid var(--border2);border-radius:18px;width:100%;max-width:420px;margin:auto;padding:22px}
.confirm h3{font-size:18px;font-weight:800;margin-bottom:8px}
.confirm p{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:20px}
.overlay.center{align-items:center;padding:18px}

/* ── Toast ─────────────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:13px 22px;font-size:15px;font-weight:600;z-index:1000;opacity:0;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(255,69,58,.4);color:var(--red)}
.toast.ok{border-color:rgba(200,255,0,.3);color:var(--accent)}

/* ── Таблица (для просмотра/аналитики на десктопе) ─────────────────────── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px}
table{width:100%;border-collapse:collapse}
thead th{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--card)}
tbody td{padding:12px 14px;font-size:14px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ════════════════════════════════════════════════════════════════════════
   ДЕСКТОП (≥ 860px): боковая навигация вместо нижней
════════════════════════════════════════════════════════════════════════ */
@media(min-width:860px){
  .nav{position:static;flex-direction:column;border-top:none;border-right:1px solid var(--border);width:230px;flex-shrink:0;padding:14px 10px;background:#111113;bottom:auto}
  .nav-item{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:10px;margin-bottom:3px}
  .nav-item .ni{font-size:18px;width:22px;text-align:center}
  .nav-item .nl{font-size:14px;font-weight:500;max-width:none}
  .nav-item:hover{background:var(--card2);color:var(--text)}
  .nav-item.active{background:var(--accent-dim)}
  .content{padding:28px 28px 40px}
  .main{min-height:calc(100vh - 57px)}
}
</style>
</head>
<body>
<div id="root">
  <div class="spin-wrap"><div class="spin"></div></div>
</div>
<script src="/js/api.js"></script>
<script src="/js/lite.js"></script>
</body>
</html>
